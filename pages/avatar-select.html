<!DOCTYPE html>
<html>
<head>

<title>Select Avatar • SpendSmart</title>

<!-- ✅ FIXED CSS -->
<link rel="stylesheet" href="../css/style.css">

<style>

body{
margin:0;
font-family:Inter;

/* ✅ FIXED BACKGROUND */
background:url("../assets/welcome-bg.png") center/cover no-repeat;
}

/* overlay blur */
.avatar-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
backdrop-filter:blur(6px);
display:flex;
justify-content:center;
align-items:center;
}

/* card */
.avatar-box{
background:white;
padding:40px;
border-radius:16px;
text-align:center;
width:420px;
box-shadow:0 10px 40px rgba(0,0,0,0.15);
}

.avatar-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:12px;
margin:20px 0;
}

.avatar-grid img{
width:60px;
height:60px;
border-radius:50%;
cursor:pointer;
transition:0.2s;
}

.avatar-grid img:hover{
transform:scale(1.1);
}

.avatar-grid img.selected{
border:3px solid #2ecc71;
}

.buttons{
margin-top:20px;
display:flex;
gap:10px;
justify-content:center;
}

.btn{
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.skip{
background:#eee;
}

.continue{
background:#2ecc71;
color:white;
}

</style>

</head>

<body>

<div class="avatar-overlay">

<div class="avatar-box">

<h2>Choose Your Avatar</h2>

<div class="avatar-grid">

<!-- ✅ FIXED IMAGE PATHS -->
<img src="../assets/avatar1.jpeg" onclick="selectAvatar(this,'avatar1.jpeg')">
<img src="../assets/avatar2.jpeg" onclick="selectAvatar(this,'avatar2.jpeg')">
<img src="../assets/avatar3.jpeg" onclick="selectAvatar(this,'avatar3.jpeg')">
<img src="../assets/avatar4.jpeg" onclick="selectAvatar(this,'avatar4.jpeg')">
<img src="../assets/avatar5.jpeg" onclick="selectAvatar(this,'avatar5.jpeg')">

<img src="../assets/avatar6.jpeg" onclick="selectAvatar(this,'avatar6.jpeg')">
<img src="../assets/avatar7.jpeg" onclick="selectAvatar(this,'avatar7.jpeg')">
<img src="../assets/avatar8.jpeg" onclick="selectAvatar(this,'avatar8.jpeg')">
<img src="../assets/avatar9.jpeg" onclick="selectAvatar(this,'avatar9.jpeg')">
<img src="../assets/avatar10.jpeg" onclick="selectAvatar(this,'avatar10.jpeg')">

</div>

<div class="buttons">

<button class="btn skip" onclick="skipAvatar()">
Skip
</button>

<button class="btn continue" onclick="continueAvatar()">
Continue
</button>

</div>

</div>

</div>

<script>

let chosenAvatar = null;

function selectAvatar(img,src){

document.querySelectorAll(".avatar-grid img").forEach(a=>{
a.classList.remove("selected");
});

img.classList.add("selected");

chosenAvatar = src;

}

function continueAvatar(){

const user = localStorage.getItem("currentUser");

if(chosenAvatar){
localStorage.setItem("avatar_"+user,chosenAvatar);
}

/* ✅ SAME FOLDER → NO ../ */
window.location.href = "welcome.html";

}

function skipAvatar(){
window.location.href = "welcome.html";
}

</script>

</body>
</html>
