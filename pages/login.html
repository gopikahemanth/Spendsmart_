<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Log In - SpendSmart</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<!-- ✅ FIXED -->
<link rel="stylesheet" href="../css/style.css">

</head>
<body>

<form class="auth-container" onsubmit="login(); return false;">

<h2>Log In</h2>

<input type="text" id="loginUser" placeholder="Username">

<div class="password-field">
<input type="password" id="password" placeholder="Password" oninput="showEye()">
<span id="togglePassword" class="toggle-password" onclick="togglePassword()">👁️</span>
</div>

<button type="submit">Log In</button>

<p class="switch-auth">
Don't have an account? <a href="register.html">Sign up</a>
</p>

<p class="forgot">
<a href="forgot-password.html">Forgot password?</a>
</p>

<p id="loginError" class="error"></p>

</form>

<!-- ✅ FIXED -->
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/main.js"></script>

</body>
</html>
