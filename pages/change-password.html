<!DOCTYPE html>
<html>
<head>
    <title>Change Password - SpendSmart</title>

    <!-- ✅ FIXED CSS PATH -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="profile-container">
    <h1>Change Password</h1>

   <form class="profile-card" onsubmit="event.preventDefault(); updatePassword();">

<label>Current Password</label>
<input type="password" id="currentPassword" required>

<label>New Password</label>
<input type="password" id="newPassword" required>

<label>Confirm New Password</label>
<input type="password" id="confirmPassword" required>

<button type="submit">Update Password</button>

</form>
</div>

<!-- ✅ MOVE JS TO SCRIPT FILE (BEST PRACTICE) -->
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/main.js"></script>

<script>
function updatePassword() {

    const user = localStorage.getItem("currentUser");
    const storedPassword = localStorage.getItem("user_" + user);

    const current = document.getElementById("currentPassword").value;
    const newPass = document.getElementById("newPassword").value;
    const confirm = document.getElementById("confirmPassword").value;

    if (current !== storedPassword) {
        alert("Current password is incorrect!");
        return;
    }

    if (newPass.length < 6) {
        alert("New password must be at least 6 characters.");
        return;
    }

    if (newPass !== confirm) {
        alert("Passwords do not match!");
        return;
    }

    localStorage.setItem("user_" + user, newPass);

    alert("Password changed successfully!");

    // ✅ CORRECT NAVIGATION
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
