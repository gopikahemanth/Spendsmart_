<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Reset Password • SpendSmart</title>

<!-- ✅ FIX -->
<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="auth-container">

<h2>Reset your password</h2>

<p class="auth-subtext">
Enter your username and choose a new password.
</p>

<input type="text" id="resetUser" placeholder="Username"
    onkeydown="if(event.key==='Enter'){ event.preventDefault(); resetPassword(); }">

<input type="password" id="newPass" placeholder="New password"
    onkeydown="if(event.key==='Enter'){ event.preventDefault(); resetPassword(); }">

<button onclick="resetPassword()">Reset Password</button>

<p id="resetError" class="error"></p>

<p class="back-login">
Remember your password? 
<a href="login.html">Back to login</a>
</p>

</div>

<!-- ✅ FIX -->
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/main.js"></script>

</body>
</html>
