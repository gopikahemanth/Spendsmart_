<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Register - SpendSmart</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<form class="auth-container" onsubmit="register(); return false;">
    <h2>Create Account</h2>

 <div class="username-wrapper">
    <input 
        type="text" 
        id="regUser" 
        placeholder="Username"
        oninput="checkUsername()">

    <small id="usernameStatus"></small>
</div>

<div class="password-field">
<input type="password" id="regPass" placeholder="Password" oninput="showEye()">
<span id="togglePassword" class="toggle-password" onclick="togglePassword()">👁️</span>
</div>

<button type="submit">Sign up</button>

<p class="switch-auth">
Already have an account? <a href="login.html">Login</a>
</p>

<p id="regError" class="error"></p>

</form>

<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/main.js"></script>

</body>
</html>
